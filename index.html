<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サイト模写</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/destyle.css@4.0.1/destyle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ここに本体を書いていきましょう -->

    <!-- header -->
    <header class="header">
      <div class="header__inner">
        <div class="header__container">
          <h1 class="header__logo">
            <a
              href="https://camp.potepan.com/courses/rails-career"
              class="header__logo-link"
            >
              <img
                src="https://camp.potepan.com/wp-content/themes/potepancamp/assets/images/logo/potepan-camp-orange.svg"
                alt="ポテパンキャンプのロゴ"
                class="header__logo-img"
              />
            </a>
          </h1>
          <nav class="header__nav">
            <ul class="header__nav-list">
              <li class="header__nav-item">
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-en"
                  >CONTENT</a
                >
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-ja"
                  >学習内容</a
                >
              </li>
              <li class="header__nav-item">
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-en"
                  >INTERVIEW</a
                >
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-ja"
                  >受講生の声</a
                >
              </li>
              <li class="header__nav-item">
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-en"
                  >FAQ</a
                >
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-ja"
                  >よくある質問</a
                >
              </li>
              <li class="header__nav-item">
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-en"
                  >RECRUIT</a
                >
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-ja"
                  >採用企業様へ</a
                >
              </li>
              <li class="header__nav-item">
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-en"
                  >U29</a
                >
                <a
                  href="https://camp.potepan.com/courses/rails-career"
                  class="header__nav__link-ja"
                  >29歳以下の方へ</a
                >
              </li>
            </ul>
            <div class="button">
              <button class="button__item">
                無料カウンセリング
              </button>
            </div>
          </nav>
          <div class="header-hamburger">
            <span class="header-hamburger-line"></span>
            <span class="header-hamburger-line"></span>
            <span class="header-hamburger-line"></span>
          </div>
        </div>
      </div>
    </header>

    <!-- main -->
    <main class="main">
      <div class="main__container">
        <div class="main__inner">
          <section class="main__section">
            <div class="main__content">
              <h2 class="main__title">
                実践的カリキュラムと<br />
                豊富な提携求人で<br />
                確実にITエンジニアへ
              </h2>
              <button class="button__item main-button">
                まずは無料カウンセリングへ
              </button>
              <p class="main__subtext">
                ※ショッパーズアイ「プログラミングスクール10社を対象にしたサイト比較イメージ調査
                <br />
                （2020 年 5 月 22 日～25
                日）」より全国の22～49歳の男女691名へのインターネット調査
              </p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
